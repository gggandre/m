<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💌 Montse, ¿nos vemos mañana? 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: url('fondo-romantico.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            margin: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
            background: #ff4081;
            color: white;
        }

        #mensaje, #plan, #sorpresa, #corazon { 
            display: none; 
            margin-top: 20px; 
        }

        .corazoncito {
            position: fixed;
            width: 30px;
            height: 30px;
            background: url('heart.png');
            background-size: cover;
            animation: float 5s infinite;
        }

        @keyframes float {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💌 Montse, ¿nos vemos mañana? 💖</h1>
    <button id="aceptar" class="btn">¡Sí, quiero verte! 🥰</button>
    <button id="mensajeBtn" class="btn">💬 Ver mensaje 💬</button>

    <div id="mensaje">Montse, me encantas y me haces muy feliz. Quiero verte mañana, darte tus ates, pastel, lasaña... y muchos abrazos. 💕</div>

    <div id="plan">📅 <strong>22 de abril:</strong> Verte, compartir momentos y sonrissas.</div>

    <div id="sorpresa">🎁 Te tengo un detalle especial… ¡Y muchos besitos también!</div>

    <div id="corazon">❤️ <strong>Te quiero mucho</strong>, Montse ❤️</div>
</div>

<script>
    document.getElementById('aceptar').onclick = () => {
        document.getElementById('plan').style.display = 'block';
        document.getElementById('sorpresa').style.display = 'block';
        document.getElementById('corazon').style.display = 'block';
        corazoncitos();
    };

    document.getElementById('mensajeBtn').onclick = () => {
        document.getElementById('mensaje').style.display = 'block';
    };

    function corazoncitos(){
        for(let i=0;i<25;i++){
            let heart=document.createElement('div');
            heart.className='corazoncito';
            heart.style.left=Math.random()*100+'vw';
            heart.style.animationDuration=Math.random()*3+2+'s';
            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(),6000);
        }
    }
</script>
</body>
</html>
