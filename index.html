<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎪 Montse, ¡Una cita mágica en el Circo! 🎟️</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: url('circo.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            font-family: 'Roboto', sans-serif;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            margin: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
            background: #ff4081;
            color: white;
        }

        #mensaje, #ticket, #payaso, #globo, #minijuego { display: none; margin-top: 20px; }

        .palomita {
            position: fixed;
            width: 30px;
            height: 30px;
            background: url('palomitas.png');
            background-size: cover;
            animation: float 5s infinite;
        }

        @keyframes float { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }

    </style>
</head>
<body>

<div class="container">
    <h1>🎪 ¡Montse, Vamos al Circo! 🎟️</h1>
    <button id="aceptar" class="btn">¡Sí, acepto! 🎉</button>
    <button id="mensajeBtn" class="btn">✨ Abrir mensaje ✨</button>

    <div id="mensaje">Contigo cada momento es mágico, Montse. Vamos a crear más recuerdos este finde.💖🎪</div>

    <div id="ticket">🎟️<strong>Boleto Especial:</strong><br>Montse & André al Circo<br>📍Atizapán<br>🗓️Este fin de semana</div>

    <img id="payaso" src="clown.png" width="150">

    <div id="globo">🎈<strong>Montse</strong>🎈</div>

    <div id="minijuego">🎯 ¡Toca aquí para lanzar el dardo y ganar una sorpresa! 🎁</div>
</div>

<script>
    document.getElementById('aceptar').onclick = () => {
        document.getElementById('ticket').style.display = 'block';
        document.getElementById('payaso').style.display = 'block';
        document.getElementById('globo').style.display = 'block';
        document.getElementById('minijuego').style.display = 'block';
        palomitas();
    };

    document.getElementById('mensajeBtn').onclick = () => {
        document.getElementById('mensaje').style.display = 'block';
    };

    function palomitas(){
        for(let i=0;i<25;i++){
            let pop=document.createElement('div');
            pop.className='palomita';
            pop.style.left=Math.random()*100+'vw';
            pop.style.animationDuration=Math.random()*3+2+'s';
            document.body.appendChild(pop);
            setTimeout(()=>pop.remove(),6000);
        }
    }

    document.getElementById('minijuego').onclick=()=>{
        alert('¡Ganaste un beso y unos ates:)!');
    };

    const globo=document.getElementById('globo');
    globo.style.animation='float 4s infinite alternate';

</script>
</body>
</html>
