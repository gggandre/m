<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬⚽ Sábado Azulcrema con mi novia preciosa 💛💙</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="estrellas"></div>
  <canvas id="confetti-canvas"></canvas>
  <audio id="gol-audio" src="https://www.fesliyanstudios.com/play-mp3/387" preload="auto"></audio>

  <div class="cancha">
    <div class="balon"></div>
    <div class="portería"></div>
  </div>

  <div class="container">
    <h1 class="titulo-animado">Mi amor, ¿lista para una cita legendaria? te amo 🎬⚽</h1>
    <p class="intro">Este sábado tenemos plan doble: primero cine con Demon Slayer y después... ¡nos vamos al Estadio Azulcrema! 💛💙</p>

    <div class="countdown"></div>

    <button id="mensajeBtn" class="btn">💌 Ver Invitación 💌</button>
    <button class="btn" onclick="confirmarAsistencia()">✅ Confirmar Plan ✅</button>
    <a class="btn" href="#" onclick="agregarAlCalendario()">🗓️ Agregar a Calendario 🗓️</a>
    <button class="btn" onclick="mostrarChecklist()">🎒 Qué Llevar 🎒</button>

    <div class="fotos-fijas">
      <img src="assets/fotos/nosotros_america.jpg" alt="Foto de nosotros con playera del América" />
      <img src="assets/fotos/montse_america.jpg" alt="Montse con su playera del América" class="especial" />
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
