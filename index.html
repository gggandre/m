<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Nuestra historia ✨</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="estrellas"></div>

  <div class="container">
    <h1 class="titulo-animado">Feliz primer mes, Montse 💖</h1>
    <p class="intro">Una pequeña sorpresa para ti, mi amor ❤️</p>

    <div class="countdown"></div>

    <!-- Botón para abrir la carta -->
    <button id="mensajeBtn" class="btn">💌 Ver Invitación 💌</button>

    <!-- Carrusel de fotos -->
    <div class="carrusel">
      <div class="slider">
        <div class="slide"><img src="assets/fotos/18.jpg" alt="Foto 16"></div>
        <div class="slide"><img src="assets/fotos/19.jpg" alt="Foto 17"></div>
        <div class="slide"><img src="assets/fotos/16.jpg" alt="Foto 14"></div>
        <div class="slide"><img src="assets/fotos/17.jpg" alt="Foto 15"></div>
        <div class="slide"><img src="assets/fotos/2.jpg" alt="Foto 1"></div>
        <div class="slide"><img src="assets/fotos/3.jpg" alt="Foto 2"></div>
        <div class="slide"><img src="assets/fotos/4.jpg" alt="Foto 3"></div>
        <div class="slide"><img src="assets/fotos/7.jpg" alt="Foto 6"></div>
        <div class="slide"><img src="assets/fotos/9.jpg" alt="Foto 7"></div>
        <div class="slide"><img src="assets/fotos/10.jpg" alt="Foto 8"></div>
        <div class="slide"><img src="assets/fotos/11.jpg" alt="Foto 9"></div>
        <div class="slide"><img src="assets/fotos/12.jpg" alt="Foto 10"></div>
        <div class="slide"><img src="assets/fotos/13.jpg" alt="Foto 11"></div>
        <div class="slide"><img src="assets/fotos/14.jpg" alt="Foto 12"></div>
        <div class="slide"><img src="assets/fotos/15.jpg" alt="Foto 13"></div>
      </div>
    </div>

    <!-- Botón para ver el video en pantalla completa -->
    <button class="btn" onclick="abrirVideo()">🎥 Ver Recuerdo 🎥</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
